name: CI

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Eskiu
        run: brew install eskiu-lang/eskiu/eskiu
      - name: Tests
        run: eskiuc test
      - name: API reference is current
        run: python3 -I tools/gen_api.py --check
      - name: Type-checks for iOS and Android
        run: |
          eskiuc src/arscene.esk --target arm64-apple-ios15.0 --test-typechecker
          eskiuc src/placer.esk --target aarch64-linux-android24 --test-typechecker
